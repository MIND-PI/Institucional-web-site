<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIND | Dashboard</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/aside.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <aside class="sidebar">
        <!-- HEADER / LOGO DO HEADER -->
        <header class="sidebar-header">
            <div class="logo-img">
                <img src="../assets/icon/logoMind/mind_logo_branca.png" alt="logo MIND">
            </div>
            <div class="logo-text">
                <h2 class="logo-title">MIND</h2>
                <h5 class="logo-subtitle">OBSERVABILIDADE</h5>
            </div>
        </header>
        <!-- INICIO DA NAV BAR -->
        <nav class="sidebar-nav">
            <section class="nav-section">
                <!-- TODO: FAZER DIFERENÇA ENTRE FORNECEDOR E CLIENTE QUANDO SE CONECTA NO SISTEMA -->
                <h4 class="nav-section-title">FLUXO DO FORNECEDOR</h4>
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="" class="nav-link">
                            <i class="bi bi-bar-chart-fill"></i>
                            Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="" class="nav-link">
                            <i class="bi bi-person-video2"></i>
                            Gerenciamento cliente
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="" class="nav-link">
                            <i class="bi bi-cpu"></i>
                            Gerenciamento clp
                        </a>
                    </li>
                    <!-- so adcionar esse data cargo para limitar apenas os adms a verem o item -->
                    <li class="nav-item" data-cargo="administrador" style="display: none;">
                        <a href="./equipe.html" class="nav-link">
                            <i class="bi bi-people-fill"></i>
                            Equipe
                        </a>
                    </li>
                </ul>
            </section>
            <section class="nav-section">
                <h4 class="nav-section-title">CONFIGURAÇÕES</h4>
                <ul class="nav-list">
                    <li class="nav-item">
                        <a class="nav-link" id="btn_config">
                            <i class="bi bi-gear"></i>
                            Configuração de usuario
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="" class="nav-link">
                            <i class="bi bi-question-circle"></i>
                            Ajuda
                        </a>
                    </li>
                </ul>
            </section>
        </nav>
        <!-- CARD DO USUARIO -->
        <footer class="user-card">
            <div class="img-card">
                <img src="/public/assets/imgs/fotosUsuarios/foto_padrao.png" alt="Foto do usuário" id="imgUser">
            </div>
            <div class="text-card">
                <p id="nomeUsuario" class="text-user-name">LÍDIA ALMEIDA</p>
                <p id="tipoUsuario" class="text-user-type">FORNECEDOR</p>
            </div>
        </footer>
        <!-- MODAL DAS CONFIGURAÇÕES DO USUARIO -->
        <div class="overlay_config" id="overlay_config">
            <div class="modal_config">
                <div class="modal_header">
                    <h2>Configurações</h2>
                    <button type="button" class="btn_fechar" id="btn_fechar_config">✖</button>
                </div>

                <form id="form_config" class="form-config">

                    <div class="input_group file_group">
                        <img src="../assets/imgs/fotosUsuarios/foto_padrao.png" alt="Preview da Foto"
                            id="preview_foto_modal" class="preview-foto-modal">
                        <div class="file_upload_wrapper">
                            <label for="input_foto" class="btn_upload">Escolher nova foto</label>
                            <input type="file" id="input_foto" name="foto_perfil" accept="image/*">
                        </div>
                    </div>

                    <div class="input_group">
                        <label for="input_nome">Nome de usuário</label>
                        <input type="text" id="input_nome" name="nome" placeholder="Digite seu novo nome">
                    </div>

                    <div class="input_group">
                        <label for="input_senha">Nova senha</label>
                        <input type="password" id="input_senha" name="senha" placeholder="Deixe em branco para manter">
                    </div>

                    <button onclick="salvarConfiguracoes()" type="button" class="btn_salvar">Salvar Alterações</button>
                </form>
            </div>
        </div>
    </aside>
    <main>
        <!-- COLOCAR CONTEÚDO PRINCIPAL -->
        <header></header>
        <section></section>
    </main>
</body>

</html>
<script src="../js/sessao.js"></script>
<script src="../js/configuracoes.js">
</script>
