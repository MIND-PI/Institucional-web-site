<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIND | Dashboard</title>
    <link rel="stylesheet" href="./../css/reset.css" />
    <link rel="stylesheet" href="./../css/aside.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./../css/dashboard-cliente.css" />
    <link rel="stylesheet" href="./../css/dashboard-micro-modelo.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <button
      class="menu-mobile"
      id="menuMobile"
      data-open="false"
      data-close="bi-list"
      data-icon-open="bi-x-lg"
    >
      <i class="bi bi-list"></i>
    </button>
    <aside class="sidebar" id="sidebar">
      <!-- HEADER -->
      <header class="sidebar-header">
        <div class="logo-img">
          <img
            src="./../assets/icon/logoMind/mind_logo_branca.png"
            alt="logo MIND"
          />
        </div>
        <div class="logo-text">
          <h2 class="logo-title">MIND</h2>
          <h5 class="logo-subtitle">OBSERVABILIDADE</h5>
        </div>
      </header>

      <!-- NAVBAR -->
      <nav class="sidebar-nav">
        <section class="nav-section">
          <!-- DIFERENÇA ENTRE FORNECEDOR E CLIENTE QUANDO SE CONECTA AO SISTEMA -->
          <h4>FLUXO DO CLIENTE</h4>
          <ul class="nav-list" id="nav_flow"></ul>
        </section>
        <section class="nav-section">
          <h4 class="nav-section-title">CONFIGURAÇÕES</h4>
          <ul class="nav-list">
            <li class="nav-item">
              <a class="nav-link" id="btn_config">
                <i class="bi bi-gear"></i>
                Configuração de usuário
              </a>
            </li>
            <li class="nav-item">
              <a
                href="https://equipe-mind.atlassian.net/servicedesk/customer/portal/2"
                class="nav-link"
                target="_blank"
              >
                <i class="bi bi-question-circle"></i>
                Ajuda
              </a>
            </li>
          </ul>
        </section>
        <section class="nav-section">
          <h4 class="nav-section-title">SAIR</h4>
          <ul class="nav-list">
            <li class="nav-item">
              <a href="nav-link" id="btn_logout" href="./../login.html">
                <i class="bi bi-box-arrow-right"></i>
                LOGOUT
              </a>
            </li>
          </ul>
        </section>
      </nav>
      <!-- CARD DO USUARIO -->
      <footer class="user-card">
        <div class="img-card">
          <img
            src="../assets/imgs/fotosUsuarios/foto_padrao.png"
            alt="Foto do usuário"
            id="imgUser"
            onerror="
              this.onerror = null;
              this.src = '../assets/imgs/fotosUsuarios/foto_padrao.png';
            "
          />
        </div>
        <div class="text-card">
          <p id="nomeUsuario" class="text-user-name">Amanda Moreira</p>
          <p id="tipoUsuario" class="text-user-type">FORNECEDOR</p>
        </div>
      </footer>
    </aside>
  </body>
</html>
